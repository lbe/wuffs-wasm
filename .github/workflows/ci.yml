name: CI
on: [push, pull_request, workflow_dispatch]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Install format tools
        run: |
          TREE_VERSION=2.5.0
          mkdir -p /tmp/treefmt-install
          curl -fsSL "https://github.com/numtide/treefmt/releases/download/v${TREE_VERSION}/treefmt_${TREE_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp/treefmt-install
          sudo mv /tmp/treefmt-install/treefmt /usr/local/bin/
          go install golang.org/x/tools/cmd/goimports@latest
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          curl -fsSL https://github.com/dprint/dprint/releases/download/0.55.2/dprint-x86_64-unknown-linux-gnu.zip -o /tmp/dprint.zip
          unzip -q /tmp/dprint.zip -d /tmp/dprint-install
          sudo mv /tmp/dprint-install/dprint /usr/local/bin/
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Run format check
        run: make format-check

      # make lint runs clang-tidy from the wasi-sdk pinned in wasm/wasi-sdk.sh
      # (downloaded on a cache miss), so CI and local lint use one LLVM release.
      - name: Cache wasi-sdk
        uses: actions/cache@v4
        with:
          path: tools/wasi-sdk-*
          key: wasi-sdk-${{ runner.os }}-${{ hashFiles('wasm/wasi-sdk.sh') }}

      # wasm/shim.c includes the Wuffs C release from a sibling checkout.
      - name: Check out Wuffs C release
        run: |
          git clone https://github.com/lbe/wuffs-mirror-release-c.git "$GITHUB_WORKSPACE/../wuffs-mirror-release-c"
          git -C "$GITHUB_WORKSPACE/../wuffs-mirror-release-c" checkout 7411f488fe2e2c205c3d3b3d28638b7356522930

      - name: Run linters (golangci-lint, clang-tidy)
        run: make lint

      - name: Run tests (coverage)
        run: make cover

      - name: Run tests with race detector
        run: make test-race

      - name: Upload coverage (Codecov)
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
