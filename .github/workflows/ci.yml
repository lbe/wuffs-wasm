name: CI
on: [push, pull_request, workflow_dispatch]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Install format tools
        run: |
          TREE_VERSION=2.5.0
          mkdir -p /tmp/treefmt-install
          curl -fsSL "https://github.com/numtide/treefmt/releases/download/v${TREE_VERSION}/treefmt_${TREE_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp/treefmt-install
          sudo mv /tmp/treefmt-install/treefmt /usr/local/bin/
          go install golang.org/x/tools/cmd/goimports@latest
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          curl -fsSL https://github.com/dprint/dprint/releases/download/0.55.2/dprint-x86_64-unknown-linux-gnu.zip -o /tmp/dprint.zip
          unzip -q /tmp/dprint.zip -d /tmp/dprint-install
          sudo mv /tmp/dprint-install/dprint /usr/local/bin/
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Run format check
        run: make format-check

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --timeout=5m
          install-mode: binary

      - name: Run tests (coverage)
        run: make cover

      - name: Upload coverage (Codecov)
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
